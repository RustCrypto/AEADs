[package]
name = "bash-prg-ae"
version = "0.1.0"
description = "Pure Rust implementation of the bash-prg-ae authenticated encryption algorithm (STB 34.101.77-2020)"
edition = "2024"
license = "Apache-2.0 OR MIT"
readme = "README.md"
documentation = "https://docs.rs/bash-prg-ae"
repository = "https://github.com/RustCrypto/AEADs/tree/master/bash-prg-ae"
keywords = ["aead", "bash-prg-ae"]
categories = ["cryptography", "no-std"]
rust-version = "1.85"

[dependencies]
aead = { version = "0.6", default-features = false }
bash-f = "0.1"
ctutils = "0.4"

# optional dependencies
zeroize = { version = "1.8", default-features = false, optional = true }

[dev-dependencies]
hex-literal = "1"

[features]
default = ["alloc", "getrandom"]
alloc = ["aead/alloc"]
arrayvec = ["aead/arrayvec"]
bytes = ["aead/bytes"]
getrandom = ["aead/getrandom"]
rand_core = ["aead/rand_core"]
zeroize = ["dep:zeroize"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
