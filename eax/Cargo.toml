[package]
name = "eax"
version = "0.6.0"
description = """
Pure Rust implementation of the EAX Authenticated Encryption with Associated Data (AEAD) Cipher with
optional architecture-specific hardware acceleration. Implemented generically around block ciphers,
it combines counter mode (CTR) encryption with CMAC authentication.
"""
authors = ["RustCrypto Developers"]
edition = "2024"
license = "Apache-2.0 OR MIT"
readme = "README.md"
documentation = "https://docs.rs/eax"
repository = "https://github.com/RustCrypto/AEADs"
keywords = ["aead", "aes", "encryption"]
categories = ["cryptography", "no-std"]
rust-version = "1.85"

[dependencies]
aead = { version = "0.6", default-features = false }
cipher = "0.5"
cmac = "0.8"
ctr = "0.10"
ctutils = "0.4"

[dev-dependencies]
aead = { version = "0.6", features = ["dev"], default-features = false }
aes = "0.9"

[features]
default = ["alloc"]
alloc = ["aead/alloc"]
arrayvec = ["aead/arrayvec"]
bytes = ["aead/bytes"]
getrandom = ["aead/getrandom"]
rand_core = ["aead/rand_core"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
