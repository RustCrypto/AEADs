[package]
name = "mgm"
version = "0.5.0-pre.1"
description = "Generic implementation of the Multilinear Galois Mode (MGM) cipher"
authors = ["RustCrypto Developers"]
edition = "2024"
license = "Apache-2.0 OR MIT"
readme = "README.md"
documentation = "https://docs.rs/mgm"
homepage = "https://github.com/RustCrypto/AEADs/tree/master/mgm"
repository = "https://github.com/RustCrypto/AEADs"
categories = ["cryptography", "no-std"]
keywords = ["encryption", "aead"]
rust-version = "1.85"

[dependencies]
aead = { version = "0.6", default-features = false }
cipher = "0.5"
cfg-if = "1"
ctutils = "0.4"

[target.'cfg(any(target_arch = "x86_64", target_arch = "x86"))'.dependencies]
cpufeatures = "0.3.1"

[dev-dependencies]
aead = { version = "0.6", features = ["dev"], default-features = false }
kuznyechik = "0.9"
magma = "0.10"
hex-literal = "1"

[features]
default = ["alloc", "getrandom"]
alloc = ["aead/alloc"]
arrayvec = ["aead/arrayvec"]
bytes = ["aead/bytes"]
getrandom = ["aead/getrandom"]
rand_core = ["aead/rand_core"]
force-soft = [] # Disable support for hardware intrinsics

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
